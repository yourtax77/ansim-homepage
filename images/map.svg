<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-label="약도: 9호선 선유도역 6·7·8번 출구 남쪽, 아이에스비즈타워 14층 세무법인 대교">
  <defs>
    <style>
      .road { stroke: #e7e2d8; stroke-linecap: round; fill: none; }
      .t { font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif; fill: #3a4441; font-size: 17px; font-weight: 500; }
      .dot { fill: #5d6764; }
    </style>
  </defs>
  <rect width="680" height="440" fill="#faf8f3"/>

  <!-- 도로 -->
  <path class="road" stroke-width="22" d="M20 82 H660"/>
  <path class="road" stroke-width="10" d="M20 160 H660"/>
  <path class="road" stroke-width="10" d="M200 215 H660"/>
  <path class="road" stroke-width="10" d="M330 300 H660"/>
  <path class="road" stroke-width="16" d="M285 30 L95 440"/>
  <path class="road" stroke-width="16" d="M395 30 L300 440"/>
  <path class="road" stroke-width="8" d="M520 82 L470 300"/>
  <path class="road" stroke-width="8" d="M150 82 L60 300"/>

  <!-- 9호선 선유도역 -->
  <path d="M40 48 H640" stroke="#c9a24f" stroke-width="5"/>
  <rect x="300" y="28" width="250" height="42" rx="21" fill="#b8863b"/>
  <text x="425" y="56" text-anchor="middle" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;font-size:16px;font-weight:600" fill="#fff">9호선 <tspan font-size="21" font-weight="800">선유도역</tspan></text>

  <!-- 출구 -->
  <g style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;font-weight:800" text-anchor="middle">
    <circle cx="297" cy="102" r="13" fill="#b8863b"/><text x="297" y="108" font-size="15" fill="#fff">8</text>
    <text x="337" y="109" font-size="18" fill="#b8863b">출구</text>
    <circle cx="370" cy="130" r="13" fill="#b8863b"/><text x="370" y="136" font-size="15" fill="#fff">7</text>
    <circle cx="420" cy="130" r="13" fill="#b8863b"/><text x="420" y="136" font-size="15" fill="#fff">6</text>
  </g>

  <!-- 주변 건물 -->
  <text class="t" x="58" y="116">S-OIL셀프</text><circle class="dot" cx="166" cy="110" r="3.5"/>
  <text class="t" x="58" y="141">선유도주유소</text>
  <circle class="dot" cx="452" cy="104" r="3.5"/><text class="t" x="462" y="110">서브웨이</text>
  <text class="t" x="226" y="190">세븐일레븐</text><circle class="dot" cx="324" cy="184" r="3.5"/>
  <circle class="dot" cx="398" cy="184" r="3.5"/><text class="t" x="408" y="190">삼호한숲아파트</text>
  <text class="t" x="168" y="246">현대블루핸즈</text><circle class="dot" cx="288" cy="240" r="3.5"/>

  <!-- 사무소 -->
  <ellipse cx="240" cy="338" rx="16" ry="5" fill="#1f4d45" opacity=".18"/>
  <path d="M240 336 C240 336 214 308 214 290 A26 26 0 1 1 266 290 C266 308 240 336 240 336 Z" fill="#1f4d45"/>
  <circle cx="240" cy="290" r="9" fill="#fff"/>
  <text x="240" y="380" text-anchor="middle" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;font-size:27px;font-weight:800;letter-spacing:-1px" fill="#1f4d45">세무법인 대교</text>
  <text x="240" y="408" text-anchor="middle" style="font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;font-size:17px;font-weight:600" fill="#b8863b">아이에스비즈타워 14층</text>
</svg>
